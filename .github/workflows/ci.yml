name: Star Forge Godot CI

on:
  push:
    branches:
      - migration/godot-gdscript
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  godot-validation:
    name: Validate Godot project and gameplay
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Forge
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo ln -sf "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot

      - name: Restore original art assets
        run: |
          mkdir -p assets
          unzip -q StarForge_Asset_Pack.zip -d "$RUNNER_TEMP/starforge-assets"
          cp -a "$RUNNER_TEMP/starforge-assets/StarForge_Asset_Pack/assets/." assets/

      - name: Organize and track source art assets
        if: github.event_name == 'push'
        run: |
          git add assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Organize source art assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Run scene smoke test
        run: godot --headless --path . res://tests/test_runner.tscn


