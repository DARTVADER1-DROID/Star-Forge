name: Star-Forge CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure simulation tests
        run: cmake -S . -B build-tests -DSTARFORGE_BUILD_GAME=OFF -DSTARFORGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build simulation
        run: cmake --build build-tests --parallel
      - name: Run simulation tests
        run: ctest --test-dir build-tests --output-on-failure
  sanitizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitizers -DSTARFORGE_BUILD_GAME=OFF -DSTARFORGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitized simulation
        run: cmake --build build-sanitizers --parallel
      - name: Run sanitized simulation tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxinerama-dev libxkbcommon-dev libwayland-dev libwayland-egl-backend-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure SDL3 desktop game
        run: cmake -S . -B build-desktop -DSTARFORGE_BUILD_GAME=ON -DSTARFORGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build desktop game and tests
        run: cmake --build build-desktop --parallel 2
      - name: Run simulation tests
        run: ctest --test-dir build-desktop --output-on-failure
