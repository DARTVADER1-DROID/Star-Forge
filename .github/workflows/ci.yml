name: Star-Forge CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure simulation tests
        run: cmake -S . -B build -DSTARFORGE_BUILD_GAME=OFF -DSTARFORGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
