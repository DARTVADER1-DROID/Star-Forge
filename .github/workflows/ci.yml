name: Star Forge Godot CI

on:
  push:
    branches:
      - migration/godot-gdscript
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Validate Godot project and gameplay
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Forge
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo ln -sf "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Run scene smoke test
        run: godot --headless --path . res://tests/test_runner.tscn

      - name: Run gameplay regression tests
        run: godot --headless --path . --script res://tests/godot_gameplay_test.gd

      - name: Check repository contains no native C sources or build files
        run: |
          if find . -type f \( -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' -o -name '*.cmake' \) -not -path './.git/*' | grep -q .; then
            echo "Native C/CMake files remain in the repository."
            find . -type f \( -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' -o -name '*.cmake' \) -not -path './.git/*'
            exit 1
          fi
