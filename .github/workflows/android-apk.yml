name: Build Android APK in the cloud

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Star-Forge APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Star-Forge
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Download SDL3 source
        run: |
          git clone \
            --depth 1 \
            --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

      - name: Generate Android project from the SDL3 template
        run: |
          python3 "$RUNNER_TEMP/SDL/build-scripts/create-android-project.py" \
            com.starforge.game \
            "$GITHUB_WORKSPACE/src/main.c" \
            "$GITHUB_WORKSPACE/src/game.c" \
            "$GITHUB_WORKSPACE/src/world.c" \
            "$GITHUB_WORKSPACE/src/game.h" \
            "$GITHUB_WORKSPACE/src/render.c" \
            "$GITHUB_WORKSPACE/src/render.h" \
            "$GITHUB_WORKSPACE/src/galaxy.c" \
            "$GITHUB_WORKSPACE/src/galaxy.h" \
            "$GITHUB_WORKSPACE/src/ui_layout.h" \
            "$GITHUB_WORKSPACE/src/assets.c" \
            "$GITHUB_WORKSPACE/src/assets.h" \
            "$GITHUB_WORKSPACE/src/stb_image.h" \
            --variant copy \
            --output "$RUNNER_TEMP/starforge-android"

      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = (
              Path(os.environ["RUNNER_TEMP"])
              / "starforge-android"
              / "com.starforge.game"
              / "app"
              / "src"
              / "main"
              / "AndroidManifest.xml"
          )
          content = manifest.read_text(encoding="utf-8")
          activity_pattern = re.compile(
              r'(<activity\b[^>]*\bandroid:name="[^"]+")',
              re.DOTALL,
          )
          if not activity_pattern.search(content):
              raise SystemExit(f"Activity declaration not found in {manifest}")
          content = activity_pattern.sub(
              r'\1\n            android:screenOrientation="landscape"',
              content,
              count=1,
          )
          manifest.write_text(content, encoding="utf-8")
          print(f"Configured landscape orientation in {manifest}")
          PY

      - name: Extract asset pack
        run: |
          mkdir -p assets data
          unzip -q StarForge_Asset_Pack.zip -d "$RUNNER_TEMP/starforge-assets"
          cp -a "$RUNNER_TEMP/starforge-assets/StarForge_Asset_Pack/assets/." assets/
          cp -a "$RUNNER_TEMP/starforge-assets/StarForge_Asset_Pack/data/." data/

      - name: Package runtime assets
        run: |
          mkdir -p "$RUNNER_TEMP/starforge-android/com.starforge.game/app/src/main/assets"
          cp -a assets data "$RUNNER_TEMP/starforge-android/com.starforge.game/app/src/main/assets/"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/starforge-android/com.starforge.game
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -PBUILD_WITH_CMAKE=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-forge-android-debug
          path: ${{ runner.temp }}/starforge-android/com.starforge.game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
