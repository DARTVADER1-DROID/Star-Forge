name: Build Android APK in the cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Star-Forge APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Star-Forge
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Download SDL3 source
        run: |
          git clone \
            --depth 1 \
            --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

      - name: Generate Android project from the SDL3 template
        run: |
          python3 "$RUNNER_TEMP/SDL/build-scripts/create-android-project.py" \
            com.starforge.game \
            "$GITHUB_WORKSPACE/src/main.c" \
            "$GITHUB_WORKSPACE/src/game.c" \
            "$GITHUB_WORKSPACE/src/game.h" \
            --variant copy \
            --output "$RUNNER_TEMP/starforge-android"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/starforge-android/com.starforge.game
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -PBUILD_WITH_CMAKE=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-forge-android-debug
          path: ${{ runner.temp }}/starforge-android/com.starforge.game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
